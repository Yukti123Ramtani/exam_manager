{% extends "base.html" %}
{% block title %}Examiner Registration · examsmanager{% endblock %}
{% block content %}
<section class="auth-center">
  <section class="card auth-card wide" aria-labelledby="reg-heading">
    <h1 class="card-title center">Examiner Registration</h1>
    <p class="muted center">Apply as an examiner. The administrator must approve your application before you can log in.</p>
    <form method="post" class="form-grid">
      <div class="field">
        <label for="name">Name</label>
        <input id="name" name="name" value="{{ form.get('name', '') }}" required>
      </div>
      <div class="field">
        <label for="email">Email Id</label>
        <input id="email" type="email" name="email" value="{{ form.get('email', '') }}" required>
      </div>
      <div class="field">
        <label for="qualification">Qualification</label>
        <input id="qualification" name="qualification" value="{{ form.get('qualification', '') }}" placeholder="e.g. Ph.D. in Computer Science" required>
      </div>
      <div class="field">
        <label for="specialization">Specialization</label>
        <input id="specialization" name="specialization" value="{{ form.get('specialization', '') }}" placeholder="e.g. Database Systems">
      </div>
      <div class="field">
        <label for="experience">Experience (years)</label>
        <input id="experience" name="experience" type="number" min="0" max="60" value="{{ form.get('experience', '') }}">
      </div>
      <div class="field">
        <label for="contact_no">Contact No.</label>
        <input id="contact_no" name="contact_no" inputmode="numeric" pattern="\d{10}" maxlength="10"
               value="{{ form.get('contact_no', '') }}" placeholder="10-digit mobile number" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" name="password" minlength="8" required>
        <span class="hint">At least 8 characters.</span>
      </div>
      <div class="field">
        <label for="confirm_password">Confirm Password</label>
        <input id="confirm_password" type="password" name="confirm_password" minlength="8" required>
      </div>
      <div class="form-actions span-2">
        <button type="submit" class="btn btn-primary">Submit Application</button>
        <a class="btn btn-ghost" href="{{ url_for('auth.login') }}">Cancel</a>
      </div>
    </form>
  </section>
</section>
{% endblock %}
